<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta | HF_AVILA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: rgba(255,255,255,0.08);
      --primary: oklch(0.85 0.18 192);
      --secondary: oklch(0.7 0.2 330);
      --foreground: #f0f0f5;
      --muted: rgba(240,240,245,0.5);
    }

    body {
      background: var(--bg);
      color: var(--foreground);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PASSWORD SCREEN ── */
    #passwordScreen {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .pass-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: min(380px, 90vw);
      text-align: center;
    }
    .pass-lock {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, oklch(0.85 0.18 192 / 0.2), oklch(0.7 0.2 330 / 0.2));
      border: 1px solid oklch(0.85 0.18 192 / 0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 22px;
    }
    .pass-box h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .pass-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .pass-input {
      width: 100%; padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--foreground);
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .pass-input:focus { border-color: var(--primary); }
    .pass-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, oklch(0.85 0.18 192), oklch(0.7 0.2 330));
      border: none; border-radius: 10px;
      color: #000; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: opacity 0.2s;
    }
    .pass-btn:hover { opacity: 0.85; }
    .pass-error {
      color: oklch(0.7 0.2 330);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
    }
    .shake { animation: shake 0.4s ease; }

    /* ── MAIN APP ── */
    #app { display: none; min-height: 100vh; }

    .app-header {
      padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .app-logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    .app-logo span { color: var(--primary); }
    .header-count {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .header-count strong { color: var(--primary); }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 0;
      height: calc(100vh - 65px);
    }

    /* ── WHEEL AREA ── */
    .wheel-area {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .glow-bg {
      position: absolute; border-radius: 50%; pointer-events: none;
    }
    .glow-bg-1 {
      width: 500px; height: 500px;
      background: oklch(0.85 0.18 192 / 0.06);
      filter: blur(120px);
      top: -100px; left: -100px;
    }
    .glow-bg-2 {
      width: 400px; height: 400px;
      background: oklch(0.7 0.2 330 / 0.06);
      filter: blur(100px);
      bottom: -80px; right: -80px;
    }

    .wheel-title {
      text-align: center; margin-bottom: 24px; position: relative; z-index: 1;
    }
    .wheel-title h1 {
      font-size: 1.8rem; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(135deg, oklch(0.85 0.18 192), oklch(0.7 0.2 330));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .wheel-title p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .wheel-wrapper {
      position: relative; display: inline-block;
      filter: drop-shadow(0 0 40px oklch(0.85 0.18 192 / 0.2));
    }
    #wheelCanvas {
      display: block;
      border-radius: 50%;
      max-width: min(480px, 85vw);
      max-height: min(480px, 85vw);
    }
    .pointer {
      position: absolute;
      top: -18px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid var(--primary);
      filter: drop-shadow(0 0 6px var(--primary));
      z-index: 10;
    }

    .spin-btn {
      margin-top: 28px; position: relative; z-index: 1;
      padding: 16px 56px;
      background: linear-gradient(135deg, oklch(0.85 0.18 192), oklch(0.7 0.2 330));
      border: none; border-radius: 50px;
      color: #000; font-weight: 800; font-size: 1.05rem;
      cursor: pointer; letter-spacing: 1px;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px oklch(0.85 0.18 192 / 0.35);
    }
    .spin-btn:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 6px 32px oklch(0.85 0.18 192 / 0.5);
    }
    .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── SIDE PANEL ── */
    .side-panel {
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .side-panel-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .side-panel-header h3 { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    .eliminated-count {
      font-size: 1.5rem; font-weight: 800;
      color: oklch(0.7 0.2 330);
      margin-top: 4px;
    }

    .side-panel-list {
      flex: 1; overflow-y: auto; padding: 12px;
    }
    .side-panel-list::-webkit-scrollbar { width: 4px; }
    .side-panel-list::-webkit-scrollbar-track { background: transparent; }
    .side-panel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .eliminated-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px;
      border-radius: 8px;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:none} }
    .eliminated-num {
      width: 22px; height: 22px; border-radius: 50%;
      background: oklch(0.7 0.2 330 / 0.2);
      border: 1px solid oklch(0.7 0.2 330 / 0.4);
      font-size: 0.7rem; font-weight: 700; color: oklch(0.7 0.2 330);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .eliminated-name { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 0.85rem;
    }
    .empty-state-icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.4; }

    .reset-btn {
      margin: 12px; padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover { border-color: oklch(0.7 0.2 330 / 0.5); color: oklch(0.7 0.2 330); }

    /* ── RESULT MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--surface);
      border: 1px solid oklch(0.85 0.18 192 / 0.3);
      border-radius: 20px;
      padding: 48px 36px;
      width: min(420px, 90vw);
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s;
      box-shadow: 0 0 60px oklch(0.85 0.18 192 / 0.15);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-confetti { font-size: 3rem; margin-bottom: 12px; }
    .modal-label {
      font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--primary); margin-bottom: 12px;
    }
    .modal-winner {
      font-size: 1.5rem; font-weight: 800;
      line-height: 1.3; margin-bottom: 32px;
      background: linear-gradient(135deg, oklch(0.85 0.18 192), oklch(0.7 0.2 330));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn {
      flex: 1; padding: 14px;
      border-radius: 10px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s;
    }
    .modal-btn-continue {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .modal-btn-continue:hover { border-color: var(--primary); color: var(--primary); }
    .modal-btn-eliminate {
      background: linear-gradient(135deg, oklch(0.85 0.18 192), oklch(0.7 0.2 330));
      border: none; color: #000;
    }
    .modal-btn-eliminate:hover { opacity: 0.85; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; height: auto; }
      .side-panel { border-left: none; border-top: 1px solid var(--border); max-height: 300px; }
      .wheel-area { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen">
  <div class="pass-box" id="passBox">
    <div class="pass-lock">🔒</div>
    <h2>Acceso Restringido</h2>
    <p>Ingresa la contraseña para acceder a la ruleta</p>
    <input type="password" class="pass-input" id="passInput" placeholder="••••" maxlength="6"
      onkeydown="if(event.key==='Enter') checkPass()">
    <button class="pass-btn" onclick="checkPass()">Ingresar</button>
    <div class="pass-error" id="passError"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header class="app-header">
    <div class="app-logo">HF<span>_</span>AVILA &nbsp;<span style="color:var(--muted);font-weight:400;font-size:0.9rem">Ruleta</span></div>
    <div class="header-count">Participantes activos: <strong id="activeCount">41</strong></div>
  </header>

  <div class="main-layout">
    <!-- WHEEL -->
    <div class="wheel-area">
      <div class="glow-bg glow-bg-1"></div>
      <div class="glow-bg glow-bg-2"></div>

      <div class="wheel-title">
        <h1>RULETA DE PARTICIPANTES</h1>
        <p>Presiona girar para seleccionar al azar</p>
      </div>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
      </div>

      <button class="spin-btn" id="spinBtn" onclick="spin()">&#9654; GIRAR</button>
    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">
      <div class="side-panel-header">
        <h3>Eliminados</h3>
        <div class="eliminated-count" id="eliminatedCount">0</div>
      </div>
      <div class="side-panel-list" id="eliminatedList">
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          Nadie eliminado aún
        </div>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ Reiniciar todos los participantes</button>
    </div>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="modal-confetti">🎉</div>
    <div class="modal-label">¡Seleccionado!</div>
    <div class="modal-winner" id="modalWinnerName"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-continue" onclick="continueWithout()">Continuar sin eliminar</button>
      <button class="modal-btn modal-btn-eliminate" onclick="eliminate()">Eliminar de la ruleta</button>
    </div>
  </div>
</div>

<script>
  function checkPass() {
    const val = document.getElementById('passInput').value.trim();
    const err = document.getElementById('passError');
    if (val === '2611') {
      document.getElementById('passwordScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      drawWheel();
    } else {
      err.textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
      const box = document.getElementById('passBox');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      document.getElementById('passInput').value = '';
    }
  }

  const ALL_NAMES = [
    'EVELYN SALAZAR GODINEZ',
    'MARIA BORBON ANGULO',
    'DANIA QUIROS ZUÑIGA',
    'ANA URBINA PEREZ',
    'ALLISSON SANCHEZ VILLALOBOS',
    'JOSE FALLAS FONSECA',
    'JAZMIN GAMBOA CHACON',
    'MARCO ZUÑIGA FERNANDEZ',
    'LUIS GAMBOA RETANA',
    'DIDIANA GUZMAN SEGURA',
    'NIKOL AGUERO QUIROS',
    'BRAYAN JIMENEZ MADRIZ',
    'ANZEL AZOFEIFA ZUÑIGA',
    'STACEY LOPEZ CECILIANO',
    'LUIS SOLIS RAMIREZ',
    'JOSHUA ELIZONDO ABARCA',
    'LILLIANA VARGAS RAMIREZ',
    'KENDRA MEZA SOLANO',
    'DANA CHAVES MONGE',
    'ALISSON CORDERO FONSECA',
    'ARIADNA CASCANTE CHINCHILLA',
    'VALERY DIAZ ACUÑA',
    'JOSE NARANJO ROJAS',
    'EVY ARAYA SEGURA',
    'DYLAN VARGAS AZOFEIFA',
    'SOFIA CARRANZA JIMENEZ',
    'EMILIANO ARIAS ARIAS',
    'SANTIAGO CASTRO ABARCA',
    'ALISSON AGUILAR CHANTO',
    'KEILYN CAMACHO ABARCA',
    'ANAIS BLANCO VARGAS',
    'JUAN VARGAS GAMBOA',
    'EDICSON PICADO QUESADA',
    'HAROLD AVILA HERNANDEZ',
    'ERICK ABARCA UREÑA',
    'MARIA CASTRO SALAZAR',
    'KEVIN PRENDAS CERDAS',
    'STEISY MORA MORALES',
    'SEBASTIAN GARRO CASTRO',
    'KENDRY VICTOR CHAVARRIA',
    'ANGELICA VARGAS CORDERO'
  ];

  const COLORS = [
    '#00c9b1','#7c3aed','#e11d48','#f59e0b','#10b981',
    '#3b82f6','#ec4899','#14b8a6','#8b5cf6','#f97316',
    '#06b6d4','#84cc16','#a855f7','#ef4444','#22d3ee',
    '#fb923c','#4ade80','#c084fc','#38bdf8','#fbbf24'
  ];

  let activeNames = [...ALL_NAMES];
  let eliminatedNames = [];
  let currentAngle = 0;
  let spinning = false;
  let winnerIdx = -1;
  let highlightIdx = -1;

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');

  function drawWheel() {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const n = activeNames.length;
    if (n === 0) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath(); ctx.arc(cx, cy, cx - 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Sin participantes', cx, cy);
      return;
    }

    ctx.clearRect(0, 0, W, H);
    const arc = (2 * Math.PI) / n;
    const r = cx - 4;

    for (let i = 0; i < n; i++) {
      const startA = currentAngle + i * arc;
      const endA = startA + arc;
      const color = COLORS[i % COLORS.length];

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startA, endA);
      ctx.closePath();

      if (i === highlightIdx) {
        ctx.fillStyle = lighten(color);
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
      } else {
        ctx.fillStyle = color;
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startA + arc / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      const name = activeNames[i];
      const fontSize = n <= 20 ? 11 : n <= 30 ? 9 : 8;
      ctx.font = `700 ${fontSize}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 3;

      const maxLen = n <= 15 ? 22 : n <= 25 ? 18 : 14;
      const displayName = name.length > maxLen ? name.substring(0, maxLen) + '…' : name;
      ctx.fillText(displayName, r - 10, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, '#0d0d1a');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(0,200,180,0.4)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,200,180,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function lighten(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)})`;
  }

  function spin() {
    if (spinning || activeNames.length < 2) return;
    spinning = true;
    highlightIdx = -1;
    document.getElementById('spinBtn').disabled = true;

    const n = activeNames.length;
    const arc = (2 * Math.PI) / n;
    winnerIdx = Math.floor(Math.random() * n);

    const pointerAngle = -Math.PI / 2;
    const winnerMid = currentAngle + winnerIdx * arc + arc / 2;
    let delta = pointerAngle - winnerMid;
    delta = ((delta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    delta += (6 + Math.floor(Math.random() * 5)) * 2 * Math.PI;

    const startAngle = currentAngle;
    const duration = 7000;
    let startTime = null;

    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const t = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - t, 5);
      currentAngle = startAngle + delta * ease;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        currentAngle = (startAngle + delta) % (2 * Math.PI);
        spinning = false;
        highlightIdx = winnerIdx;
        drawWheel();
        showResult();
      }
    }
    requestAnimationFrame(animate);
  }

  function showResult() {
    document.getElementById('modalWinnerName').textContent = activeNames[winnerIdx];
    document.getElementById('resultModal').classList.add('active');
  }

  function continueWithout() {
    document.getElementById('resultModal').classList.remove('active');
    document.getElementById('spinBtn').disabled = false;
    highlightIdx = -1;
    drawWheel();
  }

  function eliminate() {
    const name = activeNames[winnerIdx];
    eliminatedNames.push(name);
    activeNames.splice(winnerIdx, 1);
    highlightIdx = -1;
    winnerIdx = -1;
    document.getElementById('resultModal').classList.remove('active');
    document.getElementById('spinBtn').disabled = activeNames.length < 2;
    updateUI();
    drawWheel();
  }

  function updateUI() {
    document.getElementById('activeCount').textContent = activeNames.length;
    document.getElementById('eliminatedCount').textContent = eliminatedNames.length;
    const list = document.getElementById('eliminatedList');
    if (eliminatedNames.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div>Nadie eliminado aún</div>';
    } else {
      list.innerHTML = eliminatedNames.map((name, i) =>
        `<div class="eliminated-item">
          <div class="eliminated-num">${i+1}</div>
          <div class="eliminated-name">${name}</div>
        </div>`
      ).reverse().join('');
    }
  }

  function resetAll() {
    if (!confirm('¿Restaurar los 41 participantes y borrar los eliminados?')) return;
    activeNames = [...ALL_NAMES];
    eliminatedNames = [];
    highlightIdx = -1;
    winnerIdx = -1;
    currentAngle = 0;
    document.getElementById('spinBtn').disabled = false;
    updateUI();
    drawWheel();
  }
</script>
</body>
</html>
